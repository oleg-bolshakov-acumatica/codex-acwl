[mcp_servers.powershell-mcp-facade]
command = "powershell"
args = ["-NoProfile", "-ExecutionPolicy", "RemoteSigned", "-File", "scripts/Start-McpServer.ps1"]
cwd = "."
startup_timeout_sec = 20
tool_timeout_sec = 60
enabled_tools = ["sql.select", "sql.list_databases", "sql.search_schema", "sql.describe_table", "server.describe_capabilities"]

[mcp_servers.acumatica-development-guidance]
command = "powershell"
args = [
  "-NoProfile",
  "-ExecutionPolicy",
  "Bypass",
  "-File",
  "scripts/Start-StreamableHttpMcpProxy.ps1",
  "-Url",
  "https://dokploy.acumatica.com/ai-kb/mcp",
]
cwd = "."
startup_timeout_sec = 20
tool_timeout_sec = 60

[mcp_servers.jira-internal]
url = "https://jmcp.acumatica.com/mcp"
tool_timeout_sec = 60

[mcp_servers.wiki-internal]
url = "https://wmcp.acumatica.com/mcp"
tool_timeout_sec = 60

[mcp_servers.bitbucket-internal]
url = "https://mcp-gateway.acumatica.com/bitbucket"
tool_timeout_sec = 60

[mcp_servers.bitbucket-internal.tools.whoami]
approval_mode = "approve"

[mcp_servers.bitbucket-internal.tools.get_pull_request]
approval_mode = "approve"

[mcp_servers.bitbucket-internal.tools.get_pull_request_changes]
approval_mode = "approve"

[mcp_servers.bitbucket-internal.tools.get_pull_request_jira_issues]
approval_mode = "approve"

[mcp_servers.bitbucket-internal.tools.get_pull_request_file_diff]
approval_mode = "approve"

[mcp_servers.bitbucket-internal.tools.list_pull_request_commits]
approval_mode = "approve"

[mcp_servers.bitbucket-internal.tools.list_pull_request_comments]
approval_mode = "approve"

[mcp_servers.bitbucket-internal.tools.get_file_content]
approval_mode = "approve"

[mcp_servers.bitbucket-internal.tools.get_pull_request_merge_status]
approval_mode = "approve"
